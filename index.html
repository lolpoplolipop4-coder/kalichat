<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KaliChat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  /* Темная тема по умолчанию */
  --bg: #000000; --bg-elem: #111111; --bg-elem2: #1c1c1c; --bg-input: #161616;
  --yellow: #ffea00; --text: #ffffff; --text-muted: #8e8e8e;
  --border: #222222; --msg-in: #1c1c1c; --msg-out: #ffea00; --msg-out-text: #000000;
  --danger: #ff3b30; --online: #34c759;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="light"] {
  --bg: #f8fafc; --bg-elem: #ffffff; --bg-elem2: #f1f5f9; --bg-input: #f1f5f9;
  --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --msg-in: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
body { display: flex; justify-content: center; align-items: center; }

.phone-frame { width: 100%; max-width: 420px; height: 100vh; max-height: 900px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; animation: frameRise 0.8s var(--spring) both; }
@keyframes frameRise { 0% { opacity: 0; transform: translateY(40px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@media (min-width: 500px) { .phone-frame { border-radius: 44px; box-shadow: 0 0 0 12px #09090b, 0 0 0 14px #27272a, 0 30px 100px rgba(0,0,0,0.8); height: 90vh; } }

button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; transition: transform 0.2s var(--spring); position: relative; overflow: hidden; }
button:active { transform: scale(0.92); }
input, textarea { font: inherit; color: inherit; outline: none; border: none; background: none; }
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.avatar { border-radius: 50%; object-fit: cover; background: var(--bg-elem2); }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); transition: transform 0.4s var(--out-expo), opacity 0.3s; z-index: 10; }
.screen.hidden { opacity: 0; transform: translateX(30px); pointer-events: none; z-index: 0; }

/* ЯРКИЕ КНОПКИ */
.btn-primary { background: var(--yellow); color: #000; border-radius: 14px; padding: 16px; width: 100%; font-weight: 700; font-size: 15px; box-shadow: 0 0 20px rgba(255, 234, 0, 0.6); transition: all 0.3s var(--spring); }
.btn-primary:hover { background: #fff04d; box-shadow: 0 0 35px rgba(255, 234, 0, 0.9); transform: translateY(-2px); }
.btn-outline { background: transparent; color: var(--yellow); border: 1.5px solid var(--yellow); border-radius: 14px; padding: 16px; width: 100%; font-weight: 600; font-size: 15px; }
.btn-outline:hover { background: rgba(255, 234, 0, 0.1); box-shadow: 0 0 25px rgba(255, 234, 0, 0.5); }

/* АВТОРИЗАЦИЯ */
.auth-screen { padding: 40px 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; }
.logo-box { text-align: center; margin-bottom: 40px; }
.logo-icon { font-size: 80px; line-height: 1; margin-bottom: 10px; display: inline-block; filter: drop-shadow(0 0 30px rgba(255, 234, 0, 0.4)); }
.logo-text { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; color: #fff; }
.logo-text span { color: var(--yellow); }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.input-group { background: var(--bg-elem); border: 1px solid var(--border); border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
.input-group:focus-within { border-color: var(--yellow); box-shadow: 0 0 15px rgba(255, 234, 0, 0.1); }
.input-group .icon { color: var(--text-muted); width: 20px; height: 20px; }
.input-group input { width: 100%; padding: 16px 0; font-size: 15px; font-weight: 500; }

/* СПИСОК ЧАТОВ */
.chats-screen { height: 100%; display: flex; flex-direction: column; padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
.top-bar { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
.chat-list { flex: 1; overflow-y: auto; padding: 0 10px; }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 16px; cursor: pointer; transition: background 0.2s; }
.chat-item:hover { background: var(--bg-elem); }
.chat-item .avatar { width: 50px; height: 50px; }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-size: 15px; font-weight: 600; color: var(--text); }
.chat-preview { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* НИЖНЕЕ МЕНЮ */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-bottom)); background: var(--bg-elem); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; }
.nav-item.active { color: var(--yellow); filter: drop-shadow(0 0 8px rgba(255, 234, 0, 0.4)); }

/* ЧАТ И СООБЩЕНИЯ */
.chat-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 10; }
.chat-header .avatar { width: 40px; height: 40px; }
.chat-header-info { flex: 1; }
.chat-header-name { font-weight: 600; font-size: 16px; }
.messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); transition: background 0.3s; }
.message-row { display: flex; gap: 8px; animation: msgPop 0.5s var(--spring) both; }
.message-row.out { flex-direction: row-reverse; }
@keyframes msgPop { 0% { opacity: 0; transform: translateY(20px) scale(0.85); filter: blur(4px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.35; position: relative; transition: transform 0.2s; }
.msg:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
.msg.in { background: var(--msg-in); border-top-left-radius: 4px; color: var(--text); }
.msg.out { background: var(--msg-out); color: var(--msg-out-text); border-top-right-radius: 4px; }
.msg-meta { font-size: 11px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 4px; opacity: 0.6; }
.msg-author { font-size: 12px; font-weight: 700; color: var(--yellow); margin-bottom: 2px; }

/* ВВОД */
.input-area { padding: 10px 12px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.input-wrapper { flex: 1; position: relative; display: flex; align-items: center; background: var(--bg-elem); border-radius: 20px; padding: 0 12px; }
.input-wrapper input { width: 100%; padding: 14px 30px 14px 0; font-size: 15px; color: var(--text); }
.send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); color: #000; display: grid; place-items: center; box-shadow: 0 0 20px rgba(255, 234, 0, 0.5); transition: all 0.3s var(--spring); }
.send-btn:hover { box-shadow: 0 0 30px rgba(255, 234, 0, 0.9); transform: scale(1.05); }

/* НАСТРОЙКИ И ПРОФИЛЬ */
.page-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
.page-title { font-size: 18px; font-weight: 600; flex: 1; text-align: center; }
.profile-hero { display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; }
.profile-avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--yellow); padding: 3px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 234, 0, 0.3); }
.profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.profile-name { font-size: 22px; font-weight: 700; margin: 16px 0 4px; }
.profile-username { color: var(--text-muted); font-size: 14px; }
.menu-list { padding: 0 20px; display: flex; flex-direction: column; }
.menu-item { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; cursor: pointer; }
.menu-item .icon { color: var(--text-muted); }
.menu-item .label { flex: 1; }
.menu-item .value { color: var(--text-muted); font-size: 13px; margin-right: 6px; }
.menu-item.danger { color: var(--danger); }

/* МОДАЛКИ И ЗВОНКИ */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; }
.modal-backdrop.show { display: flex; }
.modal-content { background: var(--bg-elem); width: 90%; max-width: 360px; border-radius: 24px; padding: 20px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
.close-modal { width: 100%; padding: 14px; background: var(--bg-elem2); border-radius: 14px; font-weight: 600; margin-top: 16px; text-align: center; cursor: pointer; }

#callScreen { position: fixed; inset: 0; background: linear-gradient(180deg, #111 0%, #000 100%); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px 80px; color: #fff; }
#callScreen.show { display: flex; }
.call-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--yellow); padding: 4px; box-shadow: 0 0 40px rgba(255, 234, 0, 0.5); animation: pulseCall 2s infinite; }
@keyframes pulseCall { 0% { box-shadow: 0 0 20px rgba(255, 234, 0, 0.4); } 50% { box-shadow: 0 0 60px rgba(255, 234, 0, 0.9); } 100% { box-shadow: 0 0 20px rgba(255, 234, 0, 0.4); } }
.call-name { font-size: 26px; font-weight: 700; margin-top: 20px; }
.call-actions { display: flex; gap: 30px; align-items: center; margin-bottom: 40px; }
.call-btn { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; cursor: pointer; }
.call-btn.danger { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255, 59, 48, 0.5); }
.call-btn.success { background: var(--online); color: #fff; box-shadow: 0 0 20px rgba(52, 199, 89, 0.5); }
.call-btn.neutral { background: var(--bg-elem2); color: #fff; border: 1px solid var(--border); }

/* Контекстное меню */
.msg-context-menu { position: fixed; background: var(--bg-elem); border: 1px solid var(--border); border-radius: 14px; padding: 6px; display: none; z-index: 9999; min-width: 180px; }
.msg-context-menu.show { display: block; }
.msg-context-menu button { width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- ЭКРАН ЗВОНКА -->
  <div id="callScreen">
    <div style="text-align: center;">
      <img class="call-avatar" id="callAvatar" src="" alt="">
      <div class="call-name" id="callName">Имя</div>
      <div class="call-status" id="callStatus" style="color:var(--yellow); margin-top:8px;">Вызов...</div>
    </div>
    <div class="call-actions" id="incomingControls" style="display:none;">
      <button class="call-btn danger" onclick="endCall()">✕</button>
      <button class="call-btn success" onclick="acceptCall()">✓</button>
    </div>
    <div class="call-actions" id="inCallControls" style="display:none;">
      <button class="call-btn neutral" id="btnMute" onclick="toggleMute()">🎤</button>
      <button class="call-btn danger" onclick="endCall()">✕</button>
      <button class="call-btn neutral" id="btnSpeaker" onclick="toggleSpeaker()">🔊</button>
    </div>
  </div>

  <!-- АВТОРИЗАЦИЯ -->
  <div class="screen" id="screen-auth">
    <div class="auth-screen">
      <div class="logo-box">
        <div class="logo-icon">🌙</div>
        <div class="logo-text">Kali<span>Chat</span></div>
      </div>
      <div class="auth-form">
        <div class="input-group"><input type="email" id="authEmail" placeholder="Email"></div>
        <div class="input-group"><input type="password" id="authPass" placeholder="Пароль"></div>
        <button class="btn-primary" id="btnLogin">Войти</button>
        <div id="authError" style="color:var(--danger);font-size:13px;text-align:center;min-height:20px;"></div>
        <div style="text-align:center;margin:10px 0;color:var(--text-muted);font-size:13px;">или</div>
        <button class="btn-outline" onclick="nav('screen-register')">Создать аккаунт</button>
      </div>
    </div>
  </div>

  <!-- РЕГИСТРАЦИЯ -->
  <div class="screen hidden" id="screen-register">
    <div class="page-header"><button onclick="nav('screen-auth')"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><div class="page-title">Регистрация</div><div style="width:24px;"></div></div>
    <div class="auth-screen" style="padding-top:10px; justify-content: flex-start;">
      <div class="auth-form">
        <div class="input-group"><input type="text" id="regName" placeholder="Имя"></div>
        <div class="input-group"><input type="tel" id="regPhone" placeholder="Номер телефона"></div>
        <div class="input-group"><input type="text" id="regUsername" placeholder="Юзернейм (без @)"></div>
        <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
        <div class="input-group"><input type="password" id="regPass" placeholder="Пароль (мин 6 символов)"></div>
        <button class="btn-primary" id="btnRegister" style="margin-top:10px;">Зарегистрироваться</button>
        <div id="regError" style="color:var(--danger);font-size:13px;text-align:center;min-height:20px;margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <!-- ЧАТЫ -->
  <div class="screen hidden" id="screen-chats">
    <div class="chats-screen">
      <div class="top-bar">
        <div class="logo-text" style="font-size:22px; color:var(--text);">🌙 Kali<span style="color:var(--yellow)">Chat</span></div>
        <div style="display:flex; gap:12px;">
          <button onclick="document.getElementById('createMenu').classList.add('show')"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
      </div>
      <div class="chat-list" id="userList"></div>
      <div class="bottom-nav">
        <div class="nav-item active"><svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Чаты</span></div>
        <div class="nav-item" onclick="nav('screen-settings')"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Настройки</span></div>
      </div>
    </div>
  </div>

  <!-- ЧАТ -->
  <div class="screen hidden" id="screen-chat">
    <div class="chat-header">
      <button onclick="nav('screen-chats')"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <img class="avatar" id="chat-avatar" src="" alt="">
      <div class="chat-header-info"><div class="chat-header-name" id="chat-title">—</div></div>
      <div style="display:flex; gap:14px; color:var(--text-muted);">
        <button onclick="startCall(document.getElementById('chat-title').innerText, document.getElementById('chat-avatar').src)"><svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
      </div>
    </div>
    <div class="messages-area" id="messages-area"></div>
    <div class="input-area">
      <div class="input-wrapper"><input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="handleEnter(event)"></div>
      <button class="send-btn" onclick="sendMessage()"><svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="screen hidden" id="screen-profile">
    <div class="page-header">
      <button onclick="nav('screen-settings')"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="page-title">Профиль</div>
      <div style="width:24px;"></div>
    </div>
    <div style="flex:1; overflow-y:auto;">
      <div class="profile-hero">
        <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()"><img id="profileImg" src="" alt=""></div>
        <input type="file" id="avatarInput" hidden accept="image/*">
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-username" id="profileUsername">—</div>
      </div>
      <div class="menu-list">
        <div class="menu-item danger" onclick="logout()"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="label">Выйти</span></div>
      </div>
    </div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div class="screen hidden" id="screen-settings">
    <div class="page-header">
      <button onclick="nav('screen-chats')"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="page-title">Настройки</div>
      <div style="width:24px;"></div>
    </div>
    <div style="flex:1; overflow-y:auto;">
      <div class="menu-list">
        <div class="menu-item" onclick="nav('screen-profile')"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="label">Мой профиль</span></div>
        <div class="menu-item" onclick="toggleTheme()"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg><span class="label">Сменить тему</span><span class="value" id="themeValue">Темная</span></div>
        <div class="menu-item" onclick="requestPushPermission()"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="label">Включить Push-уведомления</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Модалки -->
<div class="modal-backdrop" id="createMenu">
  <div class="modal-content">
    <div class="modal-title">Создать</div>
    <div class="menu-item" onclick="openCreateGroupModal()">👥 Создать группу</div>
    <div class="menu-item" onclick="openCreateChannelModal()">📢 Создать канал</div>
    <div class="close-modal" onclick="document.getElementById('createMenu').classList.remove('show')">Отмена</div>
  </div>
</div>

<div class="modal-backdrop" id="createGroupModal">
  <div class="modal-content">
    <div class="modal-title">Новая группа</div>
    <div class="input-group" style="margin-bottom:10px;"><input type="text" id="groupName" placeholder="Название группы"></div>
    <div class="user-checkbox-list" id="groupMembersList" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto; margin-bottom:16px;"></div>
    <button class="btn-primary" onclick="createGroup()">Создать</button>
    <div class="close-modal" onclick="document.getElementById('createGroupModal').classList.remove('show')">Отмена</div>
  </div>
</div>

<div class="modal-backdrop" id="createChannelModal">
  <div class="modal-content">
    <div class="modal-title">Новый канал</div>
    <div class="input-group" style="margin-bottom:10px;"><input type="text" id="channelName" placeholder="Название канала"></div>
    <button class="btn-primary" onclick="createChannel()">Создать</button>
    <div class="close-modal" onclick="document.getElementById('createChannelModal').classList.remove('show')">Отмена</div>
  </div>
</div>

<!-- Контекстное меню -->
<div class="msg-context-menu" id="msgMenu">
  <button onclick="saveToFavorites()">⭐ В избранное</button>
  <button onclick="deleteMessage()" style="color:var(--danger)">🗑️ Удалить</button>
</div>

<!-- ЧАСТЬ 2: JS-ЛОГИКА (ВСТАВЬ СРАЗУ ПОСЛЕ HTML) -->
<script type="module">
// ВСТАВЬ СЮДА JS КОД ИЗ СЛЕДУЮЩЕГО СООБЩЕНИЯ
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, orderBy, onSnapshot, addDoc, serverTimestamp, limit, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDs8Zs8pkudFR3Gm_DN3AKekP7IO4s584g",
  authDomain: "kalichat-bcac0.firebaseapp.com",
  projectId: "kalichat-bcac0",
  storageBucket: "kalichat-bcac0.firebasestorage.app",
  messagingSenderId: "1082046246110",
  appId: "1:1082046246110:web:8e2e789344dca1d374a64f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null, currentChat = null, messagesUnsub = null;
let allUsersCache = [];
let selectedMsgData = null;

// Переключение темы
window.toggleTheme = () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
  document.getElementById('themeValue').textContent = isLight ? 'Темная' : 'Светлая';
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
};
if (localStorage.getItem('theme') === 'light') {
  document.documentElement.setAttribute('data-theme', 'light');
  document.getElementById('themeValue').textContent = 'Светлая';
}

// Навигация
window.nav = function(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const t = document.getElementById(id);
  if(t) { void t.offsetWidth; t.classList.remove('hidden'); }
};

// --- ЗВОНКИ ---
let localStream = null;
window.startCall = async (targetName, avatarUrl) => {
  document.getElementById('callName').textContent = targetName;
  document.getElementById('callAvatar').src = avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(targetName)}&background=18181b&color=ffea00&size=200`;
  document.getElementById('callStatus').textContent = 'Вызов...';
  document.getElementById('incomingControls').style.display = 'none';
  document.getElementById('inCallControls').style.display = 'flex';
  document.getElementById('callScreen').classList.add('show');

  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch(e) { alert('Нет доступа к микрофону'); }
};

window.endCall = () => {
  if(localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('callScreen').classList.remove('show');
};
window.toggleMute = () => { document.getElementById('btnMute').classList.toggle('active'); };
window.toggleSpeaker = () => { document.getElementById('btnSpeaker').classList.toggle('active'); };

// --- PUSH ---
window.requestPushPermission = async () => {
  if (!("Notification" in window)) return alert("Браузер не поддерживает уведомления");
  const perm = await Notification.requestPermission();
  if (perm === 'granted') new Notification("KaliChat", { body: "Уведомления успешно включены!" });
};

// --- АВТОРИЗАЦИЯ ---
document.getElementById('btnRegister').onclick = async () => {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const username = document.getElementById('regUsername').value.trim().replace('@', '').toLowerCase();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const err = document.getElementById('regError'); err.textContent = '';
  
  if(!name || !phone || !username || !email || pass.length < 6) return err.textContent = 'Заполните поля (пароль от 6 символов)';
  try {
    const q = query(collection(db, 'users'), where('username', '==', username));
    const snap = await getDocs(q);
    if (!snap.empty) return err.textContent = 'Этот юзернейм уже занят';

    const c = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, 'users', c.user.uid), { uid: c.user.uid, name, phone, username, email, createdAt: serverTimestamp(), avatar: '' });
  } catch(e) { err.textContent = 'Ошибка: ' + e.message; }
};

document.getElementById('btnLogin').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim(), pass = document.getElementById('authPass').value;
  const err = document.getElementById('authError'); err.textContent = '';
  try { await signInWithEmailAndPassword(auth, email, pass); } 
  catch(e) { err.textContent = 'Неверный email или пароль'; }
};

onAuthStateChanged(auth, async (user) => {
  if(user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if(snap.exists()) currentUser = snap.data();
    else currentUser = { uid: user.uid, name: user.email.split('@')[0], username: user.email.split('@')[0], email: user.email, phone: 'Не указан', avatar: '' };
    
    updateProfileUI();
    loadUsers();
    nav('screen-chats');
  } else {
    currentUser = null; nav('screen-auth');
  }
});

function getAvatarUrl(name, customAvatar) {
  if (customAvatar && customAvatar.startsWith('data:image')) return customAvatar;
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=18181b&color=ffea00&size=200&bold=true`;
}

function updateProfileUI() {
  const avatarUrl = getAvatarUrl(currentUser.name, currentUser.avatar);
  document.getElementById('profileName').textContent = currentUser.name;
  document.getElementById('profileUsername').textContent = '@' + (currentUser.username || 'user');
  document.getElementById('profileImg').src = avatarUrl;
}

document.getElementById('avatarInput').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 200;
      let width = img.width, height = img.height;
      if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
      else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const b64 = canvas.toDataURL('image/jpeg', 0.8);
      await updateDoc(doc(db, 'users', currentUser.uid), { avatar: b64 });
      currentUser.avatar = b64; updateProfileUI(); loadUsers();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

async function loadUsers() {
  const list = document.getElementById('userList'); list.innerHTML = '';
  const snap = await getDocs(collection(db, 'users'));
  allUsersCache = [];
  snap.forEach(d => {
    const u = d.data();
    allUsersCache.push(u);
    if(u.uid !== currentUser.uid) {
      const item = document.createElement('div'); item.className = 'chat-item';
      const av = getAvatarUrl(u.name, u.avatar);
      item.innerHTML = `<img class="avatar" src="${av}"><div class="chat-info"><div class="chat-name">${u.name}</div><div class="chat-preview">@${u.username || 'user'}</div></div>`;
      item.onclick = () => openChat({ id: u.uid, name: u.name, avatar: av, type: 'private', otherUid: u.uid });
      list.appendChild(item);
    }
  });
}

window.openCreateGroupModal = () => {
  document.getElementById('createMenu').classList.remove('show');
  document.getElementById('createGroupModal').classList.add('show');
  const list = document.getElementById('groupMembersList'); list.innerHTML = '';
  allUsersCache.forEach(u => {
    if(u.uid !== currentUser.uid) {
      const item = document.createElement('label'); item.className = 'user-checkbox-item';
      item.innerHTML = `<input type="checkbox" value="${u.uid}"> <span>${u.name}</span>`;
      list.appendChild(item);
    }
  });
};

window.createGroup = async () => {
  const name = document.getElementById('groupName').value.trim();
  if(!name) return alert('Введите название');
  const checkboxes = document.querySelectorAll('#groupMembersList input:checked');
  const members = [currentUser.uid, ...Array.from(checkboxes).map(c => c.value)];
  await addDoc(collection(db, 'chats'), { type: 'group', name, members, createdAt: serverTimestamp() });
  document.getElementById('createGroupModal').classList.remove('show');
  loadUsers();
};

window.openCreateChannelModal = () => {
  document.getElementById('createMenu').classList.remove('show');
  document.getElementById('createChannelModal').classList.add('show');
};

window.createChannel = async () => {
  const name = document.getElementById('channelName').value.trim();
  if(!name) return alert('Введите название');
  await addDoc(collection(db, 'chats'), { type: 'channel', name, members: [currentUser.uid], adminId: currentUser.uid, createdAt: serverTimestamp() });
  document.getElementById('createChannelModal').classList.remove('show');
  loadUsers();
};

function openChat(target) {
  currentChat = target;
  document.getElementById('chat-title').textContent = target.name;
  document.getElementById('chat-avatar').src = target.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(target.name) + '&background=ffea00&color=000';
  nav('screen-chat');
  
  if(messagesUnsub) messagesUnsub();
  const area = document.getElementById('messages-area'); area.innerHTML = '';
  
  const q = query(collection(db, 'chats', target.id, 'messages'), orderBy('createdAt', 'asc'), limit(100));
  messagesUnsub = onSnapshot(q, (s) => {
    area.innerHTML = '';
    if(s.empty) { area.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px 20px;">Пока нет сообщений.</div>'; return; }
    
    s.forEach((d, index) => {
      const m = d.data();
      const out = m.senderId === currentUser.uid;
      const time = m.time || '';
      const delay = Math.min(index * 0.05, 0.8);
      
      let mediaHtml = '';
      if(m.image) mediaHtml = `<img src="${m.image}" style="max-width:100%; border-radius:10px; margin-bottom:5px;" onclick="window.open(this.src)">`;
      let authorHtml = (!out && currentChat.type !== 'private') ? `<div class="msg-author">${m.senderName}</div>` : '';
      
      area.insertAdjacentHTML('beforeend', `
        <div class="message-row ${out?'out':'in'}" style="animation-delay: ${delay}s">
          <div class="msg ${out?'out':'in'}" oncontextmenu="showMsgMenu(event, '${d.id}')" ontouchstart="startTouch(event, '${d.id}')" ontouchend="endTouch()">
            ${authorHtml}${mediaHtml}<div>${m.text || ''}</div>
            <div class="msg-meta">${time} ${out ? '✓✓' : ''}</div>
          </div>
        </div>`);
    });
    area.scrollTop = area.scrollHeight;
  });
}

// Контекстное меню
let touchTimer;
window.startTouch = (e, id) => { touchTimer = setTimeout(() => { selectedMsgData = { id }; const menu = document.getElementById('msgMenu'); menu.classList.add('show'); menu.style.left = Math.min(e.touches[0].clientX, window.innerWidth - 190) + 'px'; menu.style.top = Math.min(e.touches[0].clientY, window.innerHeight - 160) + 'px'; }, 500); };
window.endTouch = () => clearTimeout(touchTimer);
window.showMsgMenu = (e, id) => { e.preventDefault(); selectedMsgData = { id }; const menu = document.getElementById('msgMenu'); menu.classList.add('show'); menu.style.left = Math.min(e.clientX, window.innerWidth - 190) + 'px'; menu.style.top = Math.min(e.clientY, window.innerHeight - 160) + 'px'; };
document.addEventListener('click', (e) => { if (!e.target.closest('.msg-context-menu') && !e.target.closest('.msg')) document.getElementById('msgMenu').classList.remove('show'); });

window.deleteMessage = async () => { if (!selectedMsgData) return; await deleteDoc(doc(db, 'chats', currentChat.id, 'messages', selectedMsgData.id)); document.getElementById('msgMenu').classList.remove('show'); };

window.logout = async () => { await signOut(auth); nav('screen-auth'); };
window.handleEnter = (e) => { if(e.key === 'Enter') { e.preventDefault(); sendMessage(); } };

window.sendMessage = async () => {
  const input = document.getElementById('msg-input'); const text = input.value.trim();
  if(!text || !currentChat) return;
  
  if (currentChat.type === 'channel' && currentChat.adminId !== currentUser.uid) {
    return alert('В канале могут писать только администраторы!');
  }
  
  const now = new Date();
  const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  input.value = '';
  await addDoc(collection(db, 'chats', currentChat.id, 'messages'), { senderId: currentUser.uid, senderName: currentUser.name, text, time, createdAt: serverTimestamp() });
};
</script>
</body>
</html>
